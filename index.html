<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>pr0xy // solar wind aurora</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%!important;height:100%!important}
#hud{position:fixed;top:12px;left:16px;font-family:'Courier New',monospace;font-size:11px;color:#0f8;z-index:10;pointer-events:none;text-shadow:0 0 4px #0f8;white-space:pre;line-height:1.4}
#sound-btn{position:fixed;bottom:20px;right:20px;z-index:20;background:rgba(0,255,128,0.15);border:1px solid #0f8;color:#0f8;padding:8px 16px;font-family:'Courier New',monospace;font-size:12px;cursor:pointer;border-radius:2px;text-transform:uppercase;letter-spacing:2px}
#sound-btn:hover{background:rgba(0,255,128,0.3)}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Courier New',monospace;font-size:14px;color:#0f8;z-index:100;text-align:center}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div id="loading">connecting to noaa swpc feed...</div>
<div id="hud"></div>
<button id="sound-btn">enable sound</button>
<script>
const NOAA_PLASMA='https://services.swpc.noaa.gov/products/solar-wind/plasma-2-hour.json';
const NOAA_MAG='https://services.swpc.noaa.gov/products/solar-wind/mag-2-hour.json';
let solarWind={speed:400,density:5,bz:0.5,bt:3};
let particles=[];
let auroraBands=[];
let stars=[];
let audioCtx=null,audioEnabled=false;
let masterGain,drone1,drone2,drone3,noiseSrc,noiseFilter,lfo1,lfo2;
let frameCount2=0;
let dataLoaded=false;
const MAX_PARTICLES=200;

async function loadSolarData(){
  try{
    const pRes=await fetch(NOAA_PLASMA);
    const pData=await pRes.json();
    const mRes=await fetch(NOAA_MAG);
    const mData=await mRes.json();
    const latestP=pData[pData.length-1];
    const latestM=mData[mData.length-1];
    solarWind.speed=parseFloat(latestP[2])||400;
    solarWind.density=parseFloat(latestP[3])||5;
    solarWind.bz=parseFloat(latestM[3])||0.5;
    solarWind.bt=parseFloat(latestM[4])||3;
    dataLoaded=true;
    document.getElementById('loading').style.display='none';
  }catch(e){
    console.warn('using fallback data:',e);
    solarWind.speed=450+random(-50,100);
    solarWind.density=3+random(-1,4);
    solarWind.bz=-2+random(4);
    solarWind.bt=2+random(3);
    dataLoaded=true;
    document.getElementById('loading').style.display='none';
  }
}

function setup(){
  let cnv=createCanvas(windowWidth,windowHeight);
  cnv.parent(document.body);
  colorMode(HSB,360,100,100,100);
  frameRate(60);
  noStroke();
  for(let i=0;i<300;i++){
    stars.push({x:random(width),y:random(height*0.7),s:random(0.5,2),b:random(40,100),twinkleSpeed:random(0.01,0.05)});
  }
  for(let i=0;i<5;i++){
    auroraBands.push({y:height*0.25+i*height*0.08,phase:random(TWO_PI),freq:random(0.005,0.015),amp:random(30,80),speed:random(0.002,0.008),hue:random(90,160)});
  }
  loadSolarData();
  document.getElementById('sound-btn').addEventListener('click',toggleAudio);
}

function draw(){
  frameCount2++;
  background(230,60,3);
  drawStars();
  drawAurora();
  drawParticles();
  drawScanlines();
  updateHUD();
  updateAudioParams();
  if(frameCount2%600===0&&dataLoaded)refreshData();
}

function drawStars(){
  for(let s of stars){
    let bright=s.b+sin(frameCount2*s.twinkleSpeed)*20;
    fill(0,0,bright,80);
    circle(s.x,s.y,s.s);
  }
}

function drawAurora(){
  let intensity=map(solarWind.speed,300,800,0.3,1);
  let stormBoost=constrain(map(solarWind.bz,-5,0,1.5,0),0,1.5);
  for(let band of auroraBands){
    band.phase+=band.speed*solarWind.speed/400;
    let yBase=band.y+sin(frameCount2*0.003)*10;
    let h=band.hue;
    if(solarWind.bz<-2)h=lerp(h,340,stormBoost*0.5);
    beginShape();
    vertex(0,height);
    for(let x=0;x<=width;x+=4){
      let y=yBase+sin(x*band.freq+band.phase)*band.amp*intensity;
      y+=noise(x*0.005,band.phase)*40*intensity;
      let alpha=map(abs(y-yBase),0,band.amp*intensity,70,5)*stormBoost;
      alpha=constrain(alpha,5,80);
      fill(h,70,60,alpha);
      vertex(x,y);
    }
    vertex(width,height);
    endShape(CLOSE);
    for(let layer=0;layer<3;layer++){
      beginShape();
      for(let x=0;x<=width;x+=4){
        let y=yBase+sin(x*(band.freq*1.5+layer*0.003)+band.phase+layer)*band.amp*intensity*(1+layer*0.2);
        y+=noise(x*0.008+layer,band.phase+frameCount2*0.001)*30*intensity;
        let a=map(layer,0,3,25,5)*intensity*stormBoost;
        fill(h+layer*15,80,70,a);
        vertex(x,y);
      }
      endShape();
    }
  }
}

function drawParticles(){
  if(random()<map(solarWind.speed,300,800,0.05,0.2)){
    if(particles.length<MAX_PARTICLES){
      particles.push({
        x:random(width),
        y:height*0.3+random(-30,50),
        vx:random(-0.3,0.3),
        vy:random(0.5,2)*solarWind.speed/400,
        life:100,
        maxLife:100+random(50),
        hue:solarWind.bz<-2?random(320,360):random(90,150),
        size:random(1,3)
      });
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx+sin(frameCount2*0.01+p.x*0.01)*0.5;
    p.y+=p.vy;
    p.life-=0.5;
    if(p.life<=0||p.y>height){particles.splice(i,1);continue;}
    let alpha=map(p.life,0,p.maxLife,0,60);
    let sz=p.size*map(solarWind.density,1,20,0.8,2);
    fill(p.hue,80,80,alpha);
    circle(p.x,p.y,sz);
    fill(p.hue,90,90,alpha*0.5);
    circle(p.x,p.y,sz*2);
  }
}

function drawScanlines(){
  for(let y=0;y<height;y+=3){
    stroke(0,0,0,8);
    strokeWeight(1);
    line(0,y,width,y);
  }
  noStroke();
  let flicker=random(100)>97?15:0;
  fill(120,60,60+flicker,3);
  rect(0,0,width,height);
}

function updateHUD(){
  let bzColor=solarWind.bz<-2?'#f33':solarWind.bz<0?'#f80':'#0f8';
  let stormLevel=solarWind.bz<-5?'EXTREME':solarWind.bz<-3?'STRONG':solarWind.bz<-1?'MODERATE':solarWind.bz<0?'WEAK':'QUIET';
  document.getElementById('hud').innerHTML=
`<span style="color:#0f8">pr0xy // SOLAR WIND AURORA</span>
<span style="color:#0a5">━━━━━━━━━━━━━━━━━━━━</span>
  speed:  ${solarWind.speed.toFixed(1)} km/s
  density: ${solarWind.density.toFixed(2)} p/cm³
  Bz:     <span style="color:${bzColor}">${solarWind.bz.toFixed(2)} nT</span>
  Bt:     ${solarWind.bt.toFixed(2)} nT
  storm:  ${stormLevel}
<span style="color:#0a5">━━━━━━━━━━━━━━━━━━━━</span>
  particles: ${particles.length}/${MAX_PARTICLES}
  fps: ${frameRate().toFixed(0)}
  data: ${dataLoaded?'LIVE':'OFFLINE'}`;
}

async function refreshData(){
  try{
    const pRes=await fetch(NOAA_PLASMA);
    const pData=await pRes.json();
    const mRes=await fetch(NOAA_MAG);
    const mData=await mRes.json();
    const latestP=pData[pData.length-1];
    const latestM=mData[mData.length-1];
    solarWind.speed=parseFloat(latestP[2])||solarWind.speed;
    solarWind.density=parseFloat(latestP[3])||solarWind.density;
    solarWind.bz=parseFloat(latestM[3])||solarWind.bz;
    solarWind.bt=parseFloat(latestM[4])||solarWind.bt;
  }catch(e){}
}

function toggleAudio(){
  const btn=document.getElementById('sound-btn');
  if(!audioEnabled){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0;
    masterGain.connect(audioCtx.destination);
    drone1=audioCtx.createOscillator();
    drone1.type='sawtooth';
    drone1.frequency.value=55;
    let d1g=audioCtx.createGain();
    d1g.gain.value=0.15;
    drone1.connect(d1g);
    d1g.connect(masterGain);
    drone1.start();
    drone2=audioCtx.createOscillator();
    drone2.type='sine';
    drone2.frequency.value=73.5;
    let d2g=audioCtx.createGain();
    d2g.gain.value=0.12;
    drone2.connect(d2g);
    d2g.connect(masterGain);
    drone2.start();
    drone3=audioCtx.createOscillator();
    drone3.type='triangle';
    drone3.frequency.value=110;
    let d3g=audioCtx.createGain();
    d3g.gain.value=0.08;
    drone3.connect(d3g);
    d3g.connect(masterGain);
    drone3.start();
    let bufferSize=audioCtx.sampleRate*2;
    let noiseBuffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
    let data=noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;
    noiseSrc=audioCtx.createBufferSource();
    noiseSrc.buffer=noiseBuffer;
    noiseSrc.loop=true;
    noiseFilter=audioCtx.createBiquadFilter();
    noiseFilter.type='bandpass';
    noiseFilter.frequency.value=400;
    noiseFilter.Q.value=2;
    let ng=audioCtx.createGain();
    ng.gain.value=0.06;
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(ng);
    ng.connect(masterGain);
    noiseSrc.start();
    lfo1=audioCtx.createOscillator();
    lfo1.type='sine';
    lfo1.frequency.value=0.15;
    let lfo1g=audioCtx.createGain();
    lfo1g.gain.value=0.12;
    lfo1.connect(lfo1g);
    lfo1g.connect(d1g.gain);
    lfo1.start();
    lfo2=audioCtx.createOscillator();
    lfo2.type='sine';
    lfo2.frequency.value=0.08;
    let lfo2g=audioCtx.createGain();
    lfo2g.gain.value=0.08;
    lfo2.connect(lfo2g);
    lfo2g.connect(noiseFilter.frequency);
    lfo2.start();
    masterGain.gain.linearRampToValueAtTime(0.6,audioCtx.currentTime+2);
    audioEnabled=true;
    btn.textContent='disable sound';
    btn.style.borderColor='#f80';
    btn.style.color='#f80';
  }else{
    if(masterGain&&audioCtx)masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1);
    setTimeout(()=>{audioEnabled=false;if(audioCtx){audioCtx.close();audioCtx=null;}btn.textContent='enable sound';btn.style.borderColor='#0f8';btn.style.color='#0f8';},1100);
  }
}

function updateAudioParams(){
  if(!audioEnabled||!audioCtx)return;
  let t=audioCtx.currentTime;
  if(drone1)drone1.frequency.linearRampToValueAtTime(40+solarWind.speed*0.02,t+0.5);
  if(drone2)drone2.frequency.linearRampToValueAtTime(55+solarWind.bz*2,t+0.5);
  if(drone3)drone3.frequency.linearRampToValueAtTime(80+solarWind.density*3,t+0.5);
  if(noiseFilter)noiseFilter.frequency.linearRampToValueAtTime(200+constrain(solarWind.bz+3,0,5)*100,t+0.5);
}

function windowResized(){resizeCanvas(windowWidth,windowHeight);}
</script>
</body>
</html>
