<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>pr0xy // solar wind aurora</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030308}
canvas{display:block;width:100%!important;height:100%!important}
#hud{position:fixed;top:10px;left:10px;font-family:'Courier New',monospace;font-size:12px;color:#0f8;z-index:10;pointer-events:none;line-height:1.55;background:rgba(0,0,0,0.65);padding:10px 14px;border:1px solid rgba(0,255,128,0.15);border-radius:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#sound-btn{position:fixed;bottom:12px;right:12px;z-index:20;background:rgba(0,255,128,0.06);border:1px solid rgba(0,255,128,0.35);color:#0f8;padding:7px 14px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;border-radius:2px;text-transform:uppercase;letter-spacing:2px;-webkit-backdrop-filter:blur(4px)}
#sound-btn:hover{background:rgba(0,255,128,0.15);border-color:#0f8}
#sound-btn.active{color:#f80;border-color:rgba(255,136,0,0.4)}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Courier New',monospace;font-size:13px;color:#0f8;z-index:100;text-align:center;text-shadow:0 0 10px rgba(0,255,128,0.5)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div id="loading">connecting to noaa swpc feed...</div>
<div id="hud"></div>
<button id="sound-btn">enable sound</button>
<script>
const NOAA_PLASMA='https://services.swpc.noaa.gov/products/solar-wind/plasma-2-hour.json';
const NOAA_MAG='https://services.swpc.noaa.gov/products/solar-wind/mag-2-hour.json';
let solarWind={speed:400,density:5,bz:0.5,bt:3};
let particles=[];
let auroraBands=[];
let stars=[];
let audioCtx=null,audioEnabled=false;
let masterGain,drone1,drone2,drone3,sunSrc,sunFilter,delay,feedback,lfo1,lfo2,lfo3;
let fc=0;
let dataLoaded=false;
const MAX_P=300;
const hudEl=document.getElementById('hud');
const btnEl=document.getElementById('sound-btn');
const loadEl=document.getElementById('loading');

async function loadSolarData(){
  try{
    const [pR,mR]=await Promise.all([fetch(NOAA_PLASMA),fetch(NOAA_MAG)]);
    const [p,m]=await Promise.all([pR.json(),mR.json()]);
    const lp=p[p.length-1],lm=m[m.length-1];
    solarWind.density=parseFloat(lp[1])||5;
    solarWind.speed=parseFloat(lp[2])||400;
    solarWind.bz=parseFloat(lm[3])||0.5;
    solarWind.bt=parseFloat(lm[6])||3;
    dataLoaded=true;
    loadEl.style.display='none';
  }catch(e){
    solarWind.speed=450+random(-30,60);
    solarWind.density=3+random(-1,4);
    solarWind.bz=-2+random(4);
    solarWind.bt=2+random(3);
    dataLoaded=true;
    loadEl.style.display='none';
  }
}

// HUD update helper
function updateHUDHTML(){
  let bzc=solarWind.bz<-3?'#f33':solarWind.bz<-1?'#f80':'#0f8';
  let sc=solarWind.bz<-5?'EXTREME':solarWind.bz<-3?'STRONG':solarWind.bz<-1?'MODERATE':solarWind.bz<0?'WEAK':'QUIET';
  let scc=sc==='EXTREME'||sc==='STRONG'?'#f33':sc==='MODERATE'?'#f80':sc==='WEAK'?'#fc0':'#0f8';
  let spdC=solarWind.speed>550?'#f80':'#0f8';
  hudEl.innerHTML=
`<div style="color:#0f8;font-size:12px;letter-spacing:3px;margin-bottom:6px">pr0xy // SOLAR WIND AURORA</div>
<div style="color:#075;margin-bottom:4px">━━━━━━━━━━━━━━━━━━━━━━━━━━</div>
<div>speed: <span style="color:${spdC}">${solarWind.speed.toFixed(1)} km/s</span></div>
<div>dens: <span style="color:#0a5">${solarWind.density.toFixed(2)} p/cm³</span></div>
<div>Bz: &nbsp;<span style="color:${bzc}">${solarWind.bz.toFixed(2)} nT</span></div>
<div>Bt: &nbsp;<span style="color:#0a5">${solarWind.bt.toFixed(2)} nT</span></div>
<div>storm: <span style="color:${scc}">${sc}</span></div>
<div style="color:#075;margin:4px 0">━━━━━━━━━━━━━━━━━━━━━━━━━━</div>
<div style="font-size:10px;color:#085">particles: ${particles.length} | fps: ${floor(frameRate())} | ${dataLoaded?'LIVE':'OFFLINE'}</div>
<div style="font-size:9px;color:#064;margin-top:2px">${new Date().toISOString().substr(11,8)} UTC</div>`;
}

function setup(){
  let cnv=createCanvas(windowWidth,windowHeight);
  cnv.parent(document.body);
  colorMode(HSB,360,100,100,100);
  frameRate(60);
  for(let i=0;i<500;i++){
    stars.push({x:random(width),y:random(height),s:random(0.3,2),b:random(30,100),ts:random(0.01,0.05),ph:random(TWO_PI)});
  }
  for(let i=0;i<7;i++){
    auroraBands.push({
      y:height*(0.18+i*0.07),
      phase:random(TWO_PI),
      freq:random(0.004,0.014),
      amp:random(25,55),
      speed:random(0.002,0.007),
      baseHue:random(100,150)
    });
  }
  loadSolarData();
  btnEl.addEventListener('click',toggleAudio);
}

function draw(){
  fc++;
  background(230,60,1.5);
  
  // subtle atmospheric gradient
  for(let y=height*0.1;y<height*0.65;y+=2){
    let alpha=map(y,height*0.1,height*0.65,8,0);
    fill(140+sin(fc*0.003)*15,40,20,alpha);
    rect(0,y,width,2);
  }
  
  drawStars();
  drawAurora();
  drawParticles();
  drawScanlines();
  updateHUDHTML();
  if(audioEnabled)updateAudio();
  if(fc%600===0)refreshData();
}

function drawStars(){
  for(let s of stars){
    let bright=s.b+sin(fc*s.ts+s.ph)*20;
    fill(0,0,max(bright,0),75);
    circle(s.x,s.y,s.s);
  }
}

function drawAurora(){
  let intensity=constrain(map(solarWind.speed,300,800,0.3,1.0),0.2,1.3);
  let stormBoost=constrain(map(solarWind.bz,-5,0,2.0,0.3),0.3,2.0);
  let isStorm=solarWind.bz<-2&&solarWind.speed>450;
  
  // draw with additive blending for glow
  blendMode(ADD);
  
  for(let bi=0;bi<auroraBands.length;bi++){
    let band=auroraBands[bi];
    band.phase+=band.speed*solarWind.speed/400;
    let yBase=band.y+sin(fc*0.002)*10;
    
    let h=band.baseHue;
    if(solarWind.bz<0)h=lerp(h,340,constrain(abs(solarWind.bz)/6,0,0.6));
    if(solarWind.speed>550)h=lerp(h,30,intensity*0.4);
    
    for(let layer=0;layer<4;layer++){
      let ly=layer*18;
      let a=map(layer,0,4,90,20)*intensity*stormBoost;
      let bandAmp=band.amp*(1+layer*0.3);
      let br=lerp(70,100,1-layer/4);
      let sat=lerp(80,60,layer/4);
      
      beginShape();
      vertex(0,height); // start bottom-left
      for(let x=0;x<=width;x+=3){
        let y=yBase+ly+sin(x*band.freq+band.phase)*bandAmp*intensity;
        y+=noise(x*0.005+layer,fc*0.003)*35*intensity;
        y+=sin(x*0.003+fc*0.004+layer)*15*stormBoost;
        fill(h,sat,br,a);
        vertex(x,y);
      }
      vertex(width,height); // close at bottom-right
      endShape(CLOSE);
    }
    
    // vertical rays during storms
    if(isStorm&&bi<3){
      for(let x=0;x<width;x+=20){
        let yTop=yBase+sin(x*band.freq+band.phase)*band.amp*intensity;
        let rayH=random(40,100)*intensity*stormBoost;
        let ra=random(20,45)*intensity;
        for(let dy=0;dy<rayH;dy+=2){
          let ra2=ra*map(dy,0,rayH,1,0);
          if(ra2<3)continue;
          fill(h,85,90,ra2);
          rect(x+sin(fc*0.008+x*0.02)*8,yTop+dy,2,2);
        }
      }
    }
  }
  
  blendMode(BLEND);
}

function drawParticles(){
  let spawnRate=map(solarWind.speed+solarWind.density*30,300,900,0.03,0.18);
  if(random()<spawnRate&&particles.length<MAX_P){
    particles.push({
      x:random(width),
      y:height*0.12+random(-5,25),
      vx:sin(solarWind.bz)*0.3+random(-0.2,0.2),
      vy:random(0.5,2)*solarWind.speed/400,
      life:120+random(60),
      hue:solarWind.bz<-2?random(320,360):solarWind.speed>550?random(20,50):random(90,160),
      sz:random(0.8,2.5)
    });
  }
  
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx+sin(fc*0.008+p.x*0.005)*0.4;
    p.y+=p.vy;
    p.life-=0.35;
    if(p.life<=0||p.y>height){particles.splice(i,1);continue;}
    let ml=p.life||180;
    let alpha=map(p.life,0,ml,0,55);
    let sz=p.sz*map(solarWind.density,0.5,20,0.5,1.2);
    // outer glow
    fill(p.hue,80,85,alpha*0.35);
    circle(p.x,p.y,sz*3);
    // core
    fill(p.hue,70,85,alpha);
    circle(p.x,p.y,sz);
  }
}

function drawScanlines(){
  // CRT scanlines
  for(let y=0;y<height;y+=3){
    stroke(0,0,0,5);
    strokeWeight(1);
    line(0,y,width,y);
  }
  noStroke();
  // occasional flicker
  if(random(100)>98){
    fill(0,0,100,3);
    rect(0,random(height),width,random(2,8));
  }
}

async function refreshData(){
  try{
    const [pR,mR]=await Promise.all([fetch(NOAA_PLASMA),fetch(NOAA_MAG)]);
    const [p,m]=await Promise.all([pR.json(),mR.json()]);
    const lp=p[p.length-1],lm=m[m.length-1];
    solarWind.density=parseFloat(lp[1])||solarWind.density;
    solarWind.speed=parseFloat(lp[2])||solarWind.speed;
    solarWind.bz=parseFloat(lm[3])||solarWind.bz;
    solarWind.bt=parseFloat(lm[6])||solarWind.bt;
  }catch(e){}
}

function toggleAudio(){
  if(!audioEnabled){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0;
    masterGain.connect(audioCtx.destination);
    
    drone1=audioCtx.createOscillator();drone1.type='sawtooth';drone1.frequency.value=55;
    let g1=audioCtx.createGain();g1.gain.value=0.1;drone1.connect(g1);g1.connect(masterGain);drone1.start();
    
    drone2=audioCtx.createOscillator();drone2.type='sine';drone2.frequency.value=73.5;
    let g2=audioCtx.createGain();g2.gain.value=0.08;drone2.connect(g2);g2.connect(masterGain);drone2.start();
    
    drone3=audioCtx.createOscillator();drone3.type='triangle';drone3.frequency.value=110;
    let g3=audioCtx.createGain();g3.gain.value=0.06;drone3.connect(g3);g3.connect(masterGain);drone3.start();
    
    let bs=audioCtx.sampleRate*2;
    let nb=audioCtx.createBuffer(1,bs,audioCtx.sampleRate);
    let dd=nb.getChannelData(0);
    for(let i=0;i<bs;i++)dd[i]=Math.random()*2-1;
    sunSrc=audioCtx.createBufferSource();sunSrc.buffer=nb;sunSrc.loop=true;
    sunFilter=audioCtx.createBiquadFilter();sunFilter.type='bandpass';sunFilter.frequency.value=400;sunFilter.Q.value=1.5;
    let ng=audioCtx.createGain();ng.gain.value=0.04;
    sunSrc.connect(sunFilter);sunFilter.connect(ng);ng.connect(masterGain);sunSrc.start();
    
    delay=audioCtx.createDelay(1.0);delay.delayTime.value=0.35;
    feedback=audioCtx.createGain();feedback.gain.value=0.4;
    masterGain.connect(delay);delay.connect(feedback);feedback.connect(delay);
    let dg=audioCtx.createGain();dg.gain.value=0.25;delay.connect(dg);dg.connect(audioCtx.destination);
    
    lfo1=audioCtx.createOscillator();lfo1.type='sine';lfo1.frequency.value=0.12;
    let lf1=audioCtx.createGain();lf1.gain.value=0.08;lfo1.connect(lf1);lf1.connect(g1.gain);lfo1.start();
    
    lfo2=audioCtx.createOscillator();lfo2.type='sine';lfo2.frequency.value=0.07;
    let lf2=audioCtx.createGain();lf2.gain.value=0.05;lfo2.connect(lf2);lf2.connect(sunFilter.frequency);lfo2.start();
    
    lfo3=audioCtx.createOscillator();lfo3.type='sine';lfo3.frequency.value=0.03;
    let lf3=audioCtx.createGain();lf3.gain.value=35;lfo3.connect(lf3);lf3.connect(drone1.frequency);lfo3.start();
    
    masterGain.gain.linearRampToValueAtTime(0.65,audioCtx.currentTime+2.5);
    audioEnabled=true;
    btnEl.textContent='disable sound';
    btnEl.classList.add('active');
  }else{
    if(masterGain)masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.8);
    setTimeout(()=>{
      audioEnabled=false;
      if(audioCtx){audioCtx.close();audioCtx=null;}
      btnEl.textContent='enable sound';
      btnEl.classList.remove('active');
    },900);
  }
}

function updateAudio(){
  let t=audioCtx.currentTime;
  if(drone1)drone1.frequency.linearRampToValueAtTime(40+solarWind.speed*0.025,t+0.5);
  if(drone2)drone2.frequency.linearRampToValueAtTime(55+solarWind.bz*3,t+0.5);
  if(drone3)drone3.frequency.linearRampToValueAtTime(80+solarWind.density*4,t+0.5);
  if(sunFilter)sunFilter.frequency.linearRampToValueAtTime(200+constrain(solarWind.bz+3,0,5)*100,t+0.5);
}

function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
  stars.splice(0);
  for(let i=0;i<500;i++)stars.push({x:random(width),y:random(height),s:random(0.3,2),b:random(30,100),ts:random(0.01,0.05),ph:random(TWO_PI)});
  auroraBands.splice(0);
  for(let i=0;i<7;i++)auroraBands.push({y:height*(0.18+i*0.07),phase:random(TWO_PI),freq:random(0.004,0.014),amp:random(25,55),speed:random(0.002,0.007),baseHue:random(100,150)});
}
</script>
</body>
</html>
