<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>pr0xy // solar wind aurora</title>
<meta name="description" content="Real-time solar wind aurora visualization — NOAA space weather data made visible and audible">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block;width:100%!important;height:100%!important}
#scanlines{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.04) 0px,rgba(0,0,0,0.04) 1px,transparent 1px,transparent 3px)}
#vignette{position:fixed;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%)}
#atmosphere{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(30,255,200,0.03) 0%,rgba(30,255,200,0.01) 30%,transparent 60%)}
#earth-glow{position:fixed;bottom:0;left:0;right:0;z-index:2;pointer-events:none;height:25%;
  background:radial-gradient(ellipse at 50% 100%,rgba(0,255,140,0.06) 0%,rgba(0,180,100,0.02) 50%,transparent 100%)}
#hud{position:fixed;top:10px;left:10px;font-size:11px;color:#0f8;z-index:10;pointer-events:none;line-height:1.6;
  background:rgba(0,0,0,0.78);padding:8px 12px;border:1px solid rgba(0,255,128,0.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:85vw;
  box-shadow:0 0 20px rgba(0,255,128,0.08),inset 0 0 20px rgba(0,255,128,0.03)}
#hud .title{color:#0f8;font-size:10px;letter-spacing:3px;margin-bottom:5px;text-shadow:0 0 8px rgba(0,255,128,0.5)}
#hud .divider{color:#053;border-bottom:1px solid rgba(0,255,128,0.1);padding-bottom:3px;margin:3px 0}
#sound-btn,#screenshot-btn{position:fixed;bottom:12px;z-index:20;background:rgba(0,255,128,0.06);
  border:1px solid rgba(0,255,128,0.35);color:#0f8;padding:7px 14px;font-size:10px;cursor:pointer;
  text-transform:uppercase;letter-spacing:2px;font-family:'Courier New',monospace}
#sound-btn:hover,#screenshot-btn:hover{background:rgba(0,255,128,0.15);border-color:#0f8}
#sound-btn{right:12px}
#sound-btn.active{color:#f80;border-color:rgba(255,136,0,0.4)}
#screenshot-btn{right:160px}
#storm-alert{position:fixed;top:10px;right:10px;z-index:10;pointer-events:none;font-size:11px;
  font-family:'Courier New',monospace;color:#f33;padding:8px 12px;background:rgba(0,0,0,0.85);
  border:1px solid rgba(255,50,50,0.4);letter-spacing:2px;text-align:right;opacity:0;
  transition:opacity 0.8s;animation:none;max-width:80vw;min-width:140px}
#storm-alert.visible{opacity:1;animation:pulse-alert 1.5s ease-in-out infinite}
#storm-alert.warn{opacity:1;animation:none;color:#f80;border-color:rgba(255,136,0,0.4)}
@keyframes pulse-alert{0%,100%{opacity:1;box-shadow:0 0 15px rgba(255,50,50,0.3)}
  50%{opacity:0.6;box-shadow:0 0 30px rgba(255,50,50,0.6)}}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;z-index:100;text-align:center}
#loading .asciiline{font-size:7px;line-height:1.1;letter-spacing:1px;color:#0f8;white-space:pre;text-shadow:0 0 6px rgba(0,255,128,0.4)}
#loading .subtitle{color:#0f8;font-size:10px;letter-spacing:2px;margin:10px 0 8px;opacity:0.7}
#loading .boot-text{color:#0f8;font-size:9px;opacity:0.5;animation:blink 1.2s infinite}
@keyframes blink{0%,50%{opacity:0.5}100%{opacity:0.1}}
#glitch{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 0.05s}
#bz-timeline{position:fixed;bottom:38px;left:10px;z-index:10;pointer-events:none;
  background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,128,0.15);padding:4px 6px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#bz-timeline canvas{display:block}
/* flash overlay for screenshot + storm alerts */
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:rgba(255,255,255,0);
  transition:background 0.1s}
#flash.flash{background:rgba(255,255,255,0.7)}
@media(max-width:600px){
  #hud{font-size:10px;padding:6px 8px;top:8px;left:8px}
  #sound-btn,#screenshot-btn{font-size:9px;padding:6px 10px;bottom:10px}
  #screenshot-btn{right:auto;left:10px}
  #sound-btn{right:10px}
  #storm-alert{font-size:9px;top:8px;right:8px;padding:6px 8px}
  #bz-timeline{bottom:34px;left:8px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div id="loading"></div>
<div id="atmosphere"></div>
<div id="earth-glow"></div>
<div id="main"></div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="glitch"></div>
<div id="flash"></div>
<div id="hud"></div>
<div id="storm-alert"></div>
<div id="bz-timeline"><canvas id="tl-cnv" width="180" height="40"></canvas></div>
<button id="screenshot-btn" title="Save screenshot">photo</button>
<button id="sound-btn">enable sound</button>
<script>
const NOAA_PLASMA='https://services.swpc.noaa.gov/products/solar-wind/plasma-2-hour.json';
const NOAA_MAG='https://services.swpc.noaa.gov/products/solar-wind/mag-2-hour.json';
const NOAA_KPI='https://services.swpc.noaa.gov/products/geospace/geo-magnetometer.json';
let solarWind={speed:400,density:5,bz:0.5,bt:3};
let particles=[];
let auroraBands=[];
let stars=[];
let audioCtx=null,audioEnabled=false;
let masterGain,drone1,drone2,drone3,sunSrc,sunFilter,delay,feedback,lfo1,lfo2,lfo3;
let fc=0;
let dataLoaded=false;
let intensity=1;
const MAX_P=250;
let scrollX=0;
let bzHistory=[]; // last 24h of Bz values for timeline
const KJ_SCROLL='\u2588\u2593 pr0xy // solar wind aurora // real-time NOAA space weather data // bz: {bz} nT // speed: {spd} km/s // density: {den} p/cm3 // storm: {si} // noaa swpc feed live // magnetometer active // plasma data active // \u2593\u2588 ';
const hudEl=document.getElementById('hud');
const btnEl=document.getElementById('sound-btn');
const photoEl=document.getElementById('screenshot-btn');
const loadEl=document.getElementById('loading');
const glitchEl=document.getElementById('glitch');
const flashEl=document.getElementById('flash');
const atmosEl=document.getElementById('atmosphere');
const earthEl=document.getElementById('earth-glow');
const stormEl=document.getElementById('storm-alert');
let tlCnv=document.getElementById('tl-cnv');
let tlCtx=tlCnv.getContext('2d');

async function loadSolarData(){
  try{
    const [pR,mR]=await Promise.all([fetch(NOAA_PLASMA),fetch(NOAA_MAG)]);
    const [p,m]=await Promise.all([pR.json(),mR.json()]);
    const lp=p[p.length-1],lm=m[m.length-1];
    solarWind.density=parseFloat(lp[1])||5;
    solarWind.speed=parseFloat(lp[2])||400;
    solarWind.bz=parseFloat(lm[3])||0.5;
    solarWind.bt=parseFloat(lm[6])||3;
    bzHistory.push(solarWind.bz);
    if(bzHistory.length>500)bzHistory=bzHistory.slice(-500);
    dataLoaded=true;
    loadEl.style.display='none';
  }catch(e){
    solarWind.speed=450+random(-30,60);
    solarWind.density=3+random(-1,4);
    solarWind.bz=-2+random(4);
    solarWind.bt=2+random(3);
    bzHistory.push(solarWind.bz);
    dataLoaded=true;
    loadEl.style.display='none';
  }
}

showLoadingScreen();
function showLoadingScreen(){
  var art=[
    '  SSSSS OOO   L      AAAAA  RRRR    W   W  III  N   N  DDDD',
    '  S     O  O  L     A   A  R   R   W W W   I   NN  N  D   D',
    '  SSS   O  O  L     AAAAA  RRRR    W W W   I   N N N  D   D',
    '    S   O  O  L     A   A  R  R    W   W   I   N  NN  D   D',
    '  SSS   OOO   LLLL  A   A  R   R    W W   III  N   N  DDDD',
    '',
    '  AAAAA U   U RRRR  OOO  RRRR   AAAAA',
    '  A   A U   U R   R O   O R   R  A   A',
    '  AAAAA U   U RRRR  O   O RRRR   AAAAA',
    '  A   A U   U R  R  O   O R  R   A   A',
    '  A   A  UUU  R   R  OOO  R   R  A   A',
  ];
  loadEl.innerHTML=art.map(function(l){
    return '<div class="asciiline">'+l+'</div>';
  }).join('')+
    '<div class="subtitle">\u2588 pr0xy // SOLAR WIND VISUALIZATION // 2026 \u2588</div>'+
    '<div class="boot-text">connecting to noaa swpc feed...</div>';
}
loadSolarData();

function updateHUDHTML(){
  let bzc=solarWind.bz<-3?'#f33':solarWind.bz<-1?'#f80':'#0f8';
  let sc=solarWind.bz<-5?'EXTREME':solarWind.bz<-3?'STRONG':solarWind.bz<-1?'MODERATE':solarWind.bz<0?'WEAK':'QUIET';
  let scc=sc==='EXTREME'||sc==='STRONG'?'#f33':sc==='MODERATE'?'#f80':sc==='WEAK'?'#fc0':'#0f8';
  let spdC=solarWind.speed>550?'#f80':'#0f8';
  let denC=solarWind.density>10?'#f80':solarWind.density>5?'#fc0':'#0a5';
  hudEl.innerHTML=
`<div class="title">SOLAR WIND AURORA</div>
<div class="divider"></div>
<div>speed:  <span style="color:${spdC}">${solarWind.speed.toFixed(1)} km/s</span></div>
<div>dens:   <span style="color:${denC}">${solarWind.density.toFixed(2)} p/cm3</span></div>
<div>Bz:     <span style="color:${bzc}">${solarWind.bz.toFixed(2)} nT</span></div>
<div>Bt:     <span style="color:#0a5">${solarWind.bt.toFixed(2)} nT</span></div>
<div>storm:  <span style="color:${scc}">${sc}</span></div>
<div class="divider"></div>
<div style="font-size:9px;color:#085">particles: ${particles.length} | fps: ${floor(frameRate())} | ${dataLoaded?'LIVE':'FALLBACK'}</div>
<div style="font-size:8px;color:#064;margin-top:3px;letter-spacing:1px">${new Date().toISOString().substr(11,8)} UTC</div>`;
}

function updateStormAlert(){
  let bz=solarWind.bz;
  if(bz<-5){
    stormEl.className='visible';
    stormEl.innerHTML='STORM ALERT <br>Bz: '+bz.toFixed(1)+' nT<br>'+stormLabel(bz);
  }else if(bz<-2){
    stormEl.className='warn';
    stormEl.innerHTML='ACTIVITY<br>Bz: '+bz.toFixed(1)+' nT<br>ELEVATED';
  }else{
    stormEl.className='';
    stormEl.innerHTML='';
  }
}

function stormLabel(bz){
  if(bz<-12)return 'G5 EXTREME';
  if(bz<-8)return 'G4 SEVERE';
  if(bz<-5)return 'G3 STRONG';
  if(bz<-3)return 'G2 MODERATE';
  if(bz<-1)return 'G1 MINOR';
  return 'QUIET';
}

function setup(){
  pixelDensity(1);
  let cnv=createCanvas(windowWidth,windowHeight,P2D);
  cnv.parent(document.getElementById('main'));
  drawingContext.imageSmoothingEnabled=false;
  colorMode(HSB,360,100,100,100);
  textAlign(LEFT,TOP);
  textFont('Courier New');
  for(let i=0;i<500;i++){
    stars.push({x:random(width),y:random(height),s:random(0.3,1.8),b:random(30,100),ts:random(0.01,0.05),ph:random(TWO_PI)});
  }
  for(let i=0;i<7;i++){
    auroraBands.push({
      y:height*(0.15+i*0.085),
      phase:random(TWO_PI),
      freq:random(0.003,0.014),
      amp:random(20,55),
      speed:random(0.0015,0.007),
      baseHue:random(95,155)
    });
  }
  btnEl.addEventListener('click',toggleAudio);
  photoEl.addEventListener('click',takeScreenshot);
  window.addEventListener('resize',handleResize);
}

function handleResize(){
  resizeCanvas(windowWidth,windowHeight);
  stars.splice(0);
  for(let i=0;i<500;i++)stars.push({x:random(width),y:random(height),s:random(0.3,1.8),b:random(30,100),ts:random(0.01,0.05),ph:random(TWO_PI)});
  auroraBands.splice(0);
  for(let i=0;i<7;i++)auroraBands.push({y:height*(0.15+i*0.085),phase:random(TWO_PI),freq:random(0.003,0.014),amp:random(20,55),speed:random(0.0015,0.007),baseHue:random(95,155)});
  renderTimeline();
}

function draw(){
  fc++;
  background(230,30,2);

  intensity=constrain(map(solarWind.speed,300,800,0.5,1.0),0.3,1.3);
  let isStorm=solarWind.bz<-2&&solarWind.speed>450;
  let stormBoost=constrain(map(solarWind.bz,-5,0,2.0,0.5),0.5,2.0);

  // CSS atmosphere hue/intensity
  let atmosH=solarWind.bz<0?160:145;
  let atmosA=intensity*0.5;
  atmosEl.style.background=`linear-gradient(to bottom,
    hsla(${atmosH},60%,40%,${atmosA*0.08}) 0%,
    hsla(${atmosH},50%,35%,${atmosA*0.03}) 25%,
    transparent 55%)`;

  // earth glow based on storm
  let earthH=solarWind.bz<0?lerp(140,350,constrain(abs(solarWind.bz)/6,0,0.4)):140;
  earthEl.style.background=`radial-gradient(ellipse at 50% 100%,
    hsla(${earthH},70%,30%,${0.08*intensity*stormBoost}) 0%,
    hsla(${earthH},50%,25%,${0.03*intensity}) 40%,
    transparent 100%)`;

  // CSS glitch
  if(random(100)>95){
    glitchEl.style.opacity=String(0.02+random(0.04));
    glitchEl.style.background=`linear-gradient(0deg,transparent ${random(20,80)}%,hsla(${random(360)},80%,60%,0.03) 0%,transparent ${random(20,80)}%)`;
  }else{
    glitchEl.style.opacity='0';
  }

  drawStars();
  drawAurora(isStorm,stormBoost);
  drawParticles();
  drawKeygenText();
  updateHUDHTML();
  updateStormAlert();
  if(audioEnabled)updateAudio();
  if(fc%600===0)refreshData();
  if(fc%60===0)renderTimeline();
}

function drawStars(){
  noStroke();
  for(let s of stars){
    let twinkle=s.b+sin(fc*s.ts+s.ph)*25;
    fill(0,0,max(twinkle,15),65);
    circle(s.x,s.y,s.s*(1+sin(fc*0.012+s.ph)*0.2));
  }
}

function drawAurora(isStorm,stormBoost){
  drawingContext.shadowBlur=15;
  drawingContext.shadowColor='rgba(0,255,128,0.3)';
  blendMode(ADD);

  for(let bi=0;bi<auroraBands.length;bi++){
    let band=auroraBands[bi];
    band.phase+=band.speed*(solarWind.speed/400);
    let yBase=band.y+sin(fc*0.0015+bi*0.5)*12;

    let h=band.baseHue;
    if(solarWind.bz<0)h=lerp(h,340,constrain(abs(solarWind.bz)/4,0,0.8));
    if(solarWind.speed>550)h=lerp(h,25,intensity*0.6);
    if(isStorm)h=lerp(h,285,constrain(abs(solarWind.bz+2)/5,0,0.25));

    // glow layers
    for(let layer=0;layer<2;layer++){
      let ly=layer*12;
      let a=map(layer,0,2,25,8)*intensity*stormBoost;
      let bandAmp=band.amp*(1+layer*0.25);
      let br=lerp(50,70,1-layer/2);
      let sat=lerp(75,50,layer/2);
      let sw=lerp(12,6,2-layer);
      stroke(h,sat,br,a);
      strokeWeight(sw);
      noFill();
      beginShape();
      for(let x=0;x<=width;x+=8){
        let y=yBase+ly+sin(x*band.freq+band.phase)*bandAmp*intensity;
        y+=sin(x*0.002+fc*0.002+bi+layer*1.5)*20*stormBoost;
        y+=sin(x*0.005+fc*0.003)*8;
        vertex(x,y);
      }
      endShape();
    }

    // bright core
    drawingContext.shadowBlur=4;
    stroke(h,80,92,50*intensity);
    strokeWeight(1.2);
    noFill();
    beginShape();
    for(let x=0;x<=width;x+=4){
      let y=yBase+sin(x*band.freq+band.phase)*band.amp*intensity;
      y+=sin(x*0.004+fc*0.0015+bi)*14*intensity;
      vertex(x,y);
    }
    endShape();
    drawingContext.shadowBlur=15;

    // vertical rays during storms
    if(isStorm&&bi<2){
      drawingContext.shadowBlur=4;
      for(let rx=0;rx<width;rx+=18){
        let yTop=yBase+sin(rx*band.freq+band.phase)*band.amp*intensity+sin(rx*0.003+fc*0.001)*15;
        let rayH=random(25,70)*intensity*stormBoost;
        let ra=random(10,30)*intensity;
        let flicker=0.5+sin(fc*0.06+rx*0.05)*0.5;
        stroke(h,65,88,ra*flicker);
        strokeWeight(1.5);
        let sway=sin(fc*0.01+rx*0.03)*2;
        line(rx+sway,yTop,rx+sway,yTop-rayH);
      }
      drawingContext.shadowBlur=15;
    }
  }

  blendMode(BLEND);
  drawingContext.shadowBlur=0;
  strokeWeight(1);
}

function drawKeygenText(){
  let msg=KJ_SCROLL
    .replace('{bz}',solarWind.bz.toFixed(2))
    .replace('{spd}',solarWind.speed.toFixed(0))
    .replace('{den}',solarWind.density.toFixed(2))
    .replace('{si}',stormLabel(solarWind.bz));
  textSize(10);
  let tw=textWidth(msg);
  scrollX-=0.6;
  if(scrollX<-tw)scrollX+=tw;

  fill(120,70,75,40);
  noStroke();
  for(let i=-1;i<ceil(width/tw)+1;i++){
    text(msg,scrollX+i*tw,height-16);
  }

  // corner brackets in proper HSB green
  stroke(120,60,70,18);
  strokeWeight(1);
  let bm=8,bl=22;
  line(bm,height-bm-bl,bm,height-bm);
  line(bm,height-bm,bm+bl,height-bm);
  line(width-bm,height-bm-bl,width-bm,height-bm);
  line(width-bm-bl,height-bm,width-bm,height-bm);
  let hh=min(hudEl.offsetHeight+18,120);
  line(3,3,3,hh);
  line(3,3,bl+3,3);
  line(width-3,3,width-3,hh);
  line(width-bl-3,3,width-3,3);
  noStroke();
}

function drawParticles(){
  let spawnRate=map(solarWind.speed+solarWind.density*30,300,900,0.04,0.16);
  if(random()<spawnRate&&particles.length<MAX_P){
    let ph=solarWind.bz<-2?random(320,360):solarWind.speed>550?random(20,50):random(90,160);
    particles.push({
      x:random(width*0.1,width*0.9),
      y:height*0.08+random(-5,25),
      vx:solarWind.bz*0.12+random(-0.25,0.25),
      vy:random(0.4,1.5)*solarWind.speed/400,
      life:100+random(70),
      hue:ph,
      sz:random(0.8,2.2)
    });
  }

  noStroke();
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx+sin(fc*0.006+p.x*0.004)*0.4+cos(fc*0.003+p.y*0.003)*0.2;
    p.y+=p.vy;
    p.life-=0.4;
    if(p.life<=0||p.y>height||p.x<-20||p.x>width+20){particles.splice(i,1);continue;}
    let ml=p.life||170;
    let alpha=map(p.life,0,ml,0,50);
    let sz=p.sz*map(solarWind.density,0.5,20,0.5,1.2);
    fill(p.hue,70,85,alpha*0.2);
    circle(p.x,p.y,sz*3.5);
    fill(p.hue,60,92,alpha);
    circle(p.x,p.y,sz);
  }
}

// 24h Bz sparkline timeline
function renderTimeline(){
  if(!tlCnv)return;
  let w=tlCnv.width;
  let h=tlCnv.height;
  if(bzHistory.length<2){
    bzHistory=[0,0.5,-1,0.2,-2,solarWind.bz];
  }
  let data=bzHistory.slice(-120); // last 120 samples
  let minBz=-15,maxBz=5;
  tlCtx.clearRect(0,0,w,h);
  // label
  tlCtx.fillStyle='rgba(0,255,128,0.4)';
  tlCtx.font='8px Courier New';
  tlCtx.fillText('Bz 24h  min:'+min(data).toFixed(1),3,9);
  // zero line
  let zeroY=map(0,minBz,maxBz,h,0);
  tlCtx.strokeStyle='rgba(0,255,128,0.15)';
  tlCtx.lineWidth=1;
  tlCtx.beginPath();
  tlCtx.moveTo(0,zeroY);
  tlCtx.lineTo(w,zeroY);
  tlCtx.stroke();
  // fill area
  tlCtx.beginPath();
  for(let i=0;i<data.length;i++){
    let x=map(i,0,data.length-1,20,w-2);
    let y=map(data[i],minBz,maxBz,h-2,2);
    if(i===0)tlCtx.moveTo(x,y);
    else tlCtx.lineTo(x,y);
  }
  let lastX=map(data.length-1,0,data.length-1,20,w-2);
  tlCtx.lineTo(lastX,h);
  tlCtx.lineTo(20+(0)*(w-22),h);
  tlCtx.closePath();
  // negative Bz (storm) = red fill
  tlCtx.fillStyle='rgba(255,60,60,0.15)';
  tlCtx.fill();
  // line
  tlCtx.beginPath();
  for(let i=0;i<data.length;i++){
    let x=map(i,0,data.length-1,20,w-2);
    let y=map(data[i],minBz,maxBz,h-2,2);
    if(i===0)tlCtx.moveTo(x,y);
    else tlCtx.lineTo(x,y);
  }
  let currentBz=data[data.length-1];
  const bzColor=currentBz<-3?'#f33':currentBz<-1?'#f80':'#0f8';
  tlCtx.strokeStyle=bzColor;
  tlCtx.lineWidth=1.5;
  tlCtx.stroke();
  // current point
  let cx=map(data.length-1,0,data.length-1,20,w-2);
  let cy=map(currentBz,minBz,maxBz,h-2,2);
  tlCtx.beginPath();
  tlCtx.arc(cx,cy,3,0,Math.PI*2);
  tlCtx.fillStyle=bzColor;
  tlCtx.fill();
}

function min(arr){return Math.min.apply(null,arr);}

async function refreshData(){
  try{
    const [pR,mR]=await Promise.all([fetch(NOAA_PLASMA),fetch(NOAA_MAG)]);
    const [p,m]=await Promise.all([pR.json(),mR.json()]);
    const lp=p[p.length-1],lm=m[m.length-1];
    solarWind.density=parseFloat(lp[1])||solarWind.density;
    solarWind.speed=parseFloat(lp[2])||solarWind.speed;
    solarWind.bz=parseFloat(lm[3])||solarWind.bz;
    solarWind.bt=parseFloat(lm[6])||solarWind.bt;
    bzHistory.push(solarWind.bz);
    if(bzHistory.length>500)bzHistory=bzHistory.slice(-500);
    renderTimeline();
  }catch(e){}
}

function takeScreenshot(){
  // flash effect
  flashEl.classList.add('flash');
  setTimeout(()=>flashEl.classList.remove('flash'),200);
  // grab canvas, draw composite
  let sc=document.createElement('canvas');
  let sw=width,sh=height;
  sc.width=sw;sc.height=sh;
  let sctx=sc.getContext('2d');
  // main canvas
  let mc=document.querySelector('#main canvas');
  if(mc)sctx.drawImage(mc,0,0);
  // scanlines
  sctx.fillStyle='rgba(0,0,0,0.04)';
  for(let y=0;y<sh;y+=3)sctx.fillRect(0,y,sw,1);
  // vignette gradient
  let vg=sctx.createRadialGradient(sw/2,sh/2,sw*0.3,sw/2,sh/2,sw*0.7);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(0,0,0,0.5)');
  sctx.fillStyle=vg;
  sctx.fillRect(0,0,sw,sh);
  // HUD text
  sctx.font='11px Courier New';
  sctx.fillStyle='#0f8';
  let y=28;
  sctx.fillText('pr0xy // SOLAR WIND AURORA',15,y);
  sctx.font='10px Courier New';
  y+=20;sctx.fillText('speed: '+solarWind.speed.toFixed(1)+' km/s  |  dens: '+solarWind.density.toFixed(2)+' p/cm³',15,y);
  y+=16;sctx.fillText('Bz: '+solarWind.bz.toFixed(2)+' nT  |  Bt: '+solarWind.bt.toFixed(2)+' nT  |  '+stormLabel(solarWind.bz),15,y);
  y+=16;sctx.fillStyle='#064';sctx.fillText(new Date().toISOString().substr(0,19).replace('T',' ')+' UTC  |  xpr0xy.github.io/meteor-watch-signal',15,y);
  // download
  sc.toBlob(function(blob){
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');
    a.href=url;a.download='solar-wind-'+Date.now()+'.png';
    a.click();URL.revokeObjectURL(url);
  });
}

function toggleAudio(){
  if(!audioEnabled){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0;
    masterGain.connect(audioCtx.destination);

    drone1=audioCtx.createOscillator();drone1.type='sawtooth';drone1.frequency.value=55;
    let g1=audioCtx.createGain();g1.gain.value=0.1;drone1.connect(g1);g1.connect(masterGain);drone1.start();

    drone2=audioCtx.createOscillator();drone2.type='sine';drone2.frequency.value=73.5;
    let g2=audioCtx.createGain();g2.gain.value=0.08;drone2.connect(g2);g2.connect(masterGain);drone2.start();

    drone3=audioCtx.createOscillator();drone3.type='triangle';drone3.frequency.value=110;
    let g3=audioCtx.createGain();g3.gain.value=0.06;drone3.connect(g3);g3.connect(masterGain);drone3.start();

    let bs=audioCtx.sampleRate*2;
    let nb=audioCtx.createBuffer(1,bs,audioCtx.sampleRate);
    let dd=nb.getChannelData(0);
    for(let i=0;i<bs;i++)dd[i]=Math.random()*2-1;
    sunSrc=audioCtx.createBufferSource();sunSrc.buffer=nb;sunSrc.loop=true;
    sunFilter=audioCtx.createBiquadFilter();sunFilter.type='bandpass';sunFilter.frequency.value=400;sunFilter.Q.value=1.5;
    let ng=audioCtx.createGain();ng.gain.value=0.04;
    sunSrc.connect(sunFilter);sunFilter.connect(ng);ng.connect(masterGain);sunSrc.start();

    delay=audioCtx.createDelay(1.0);delay.delayTime.value=0.35;
    feedback=audioCtx.createGain();feedback.gain.value=0.4;
    masterGain.connect(delay);delay.connect(feedback);feedback.connect(delay);
    let dg=audioCtx.createGain();dg.gain.value=0.25;delay.connect(dg);dg.connect(audioCtx.destination);

    lfo1=audioCtx.createOscillator();lfo1.type='sine';lfo1.frequency.value=0.12;
    let lf1=audioCtx.createGain();lf1.gain.value=0.08;lfo1.connect(lf1);lf1.connect(g1.gain);lfo1.start();

    lfo2=audioCtx.createOscillator();lfo2.type='sine';lfo2.frequency.value=0.07;
    let lf2=audioCtx.createGain();lf2.gain.value=0.05;lfo2.connect(lf2);lf2.connect(sunFilter.frequency);lfo2.start();

    lfo3=audioCtx.createOscillator();lfo3.type='sine';lfo3.frequency.value=0.03;
    let lf3=audioCtx.createGain();lf3.gain.value=35;lfo3.connect(lf3);lf3.connect(drone1.frequency);lfo3.start();

    masterGain.gain.linearRampToValueAtTime(0.65,audioCtx.currentTime+2.5);
    audioEnabled=true;
    btnEl.textContent='disable sound';
    btnEl.classList.add('active');
  }else{
    if(masterGain)masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.8);
    setTimeout(()=>{
      audioEnabled=false;
      if(audioCtx){audioCtx.close();audioCtx=null;}
      btnEl.textContent='enable sound';
      btnEl.classList.remove('active');
    },900);
  }
}

function updateAudio(){
  let t=audioCtx.currentTime;
  if(drone1)drone1.frequency.linearRampToValueAtTime(40+solarWind.speed*0.025,t+0.5);
  if(drone2)drone2.frequency.linearRampToValueAtTime(55+solarWind.bz*3,t+0.5);
  if(drone3)drone3.frequency.linearRampToValueAtTime(80+solarWind.density*4,t+0.5);
  if(sunFilter)sunFilter.frequency.linearRampToValueAtTime(200+constrain(solarWind.bz+3,0,5)*100,t+0.5);
}
